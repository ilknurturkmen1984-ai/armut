<style>

  --bg:#FBF8EF; --card:#FFFFFF; --ink:#22281A; --ink2:#5C6450; --muted:#8C9381; --line:#ECE8DA;

@media (prefers-color-scheme:dark){:root{

}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:720px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px;display:flex;align-items:center;gap:10px}
header .logo{width:34px;height:34px;border-radius:10px}
header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.2px}
header .sp{flex:1}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--gelir)}.dot.wait{background:#D6A21E}.dot.err{background:var(--gider)}
.period{display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 0 14px}
.period b{min-width:170px;text-align:center;font-weight:600}
.ib{border:0;background:var(--card);border:1px solid var(--line);width:36px;height:36px;border-radius:12px;cursor:pointer;font-size:18px;line-height:1}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600}
.hero{padding:20px}
.hero .lbl{color:var(--muted);font-size:13px}

.pill b{font-size:17px}

.bar{height:8px;background:var(--line);border-radius:99px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0}
.tx{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}

.tx .amt{font-weight:650;white-space:nowrap}

.day{font-size:12px;color:var(--muted);margin:14px 2px 2px;font-weight:600}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.fab{position:fixed;right:max(18px,calc(50% - 342px));bottom:calc(84px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;border:0;background:var(--pear);color:#fff;font-size:32px;box-shadow:0 6px 20px rgba(85,118,26,.4);cursor:pointer;z-index:6}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn.red{background:var(--gider-l);color:var(--gider)}
.btn.sm{width:auto;padding:8px 12px;font-size:13px;border-radius:11px}

.scroll{overflow-x:auto;margin:0 -6px;padding:0 6px}
.muted{color:var(--muted)} .small{font-size:12px}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .x{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 6px}
.net{font-size:30px;font-weight:750;letter-spacing:-.6px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;box-shadow:var(--sh);animation:fd .2s;max-width:90vw;text-align:center}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.badge{font-size:11px;background:var(--pear-l);color:var(--pear-d);padding:2px 8px;border-radius:99px;font-weight:600}
details.ac{border-top:1px solid var(--line);padding:10px 0}
details.ac summary{cursor:pointer;font-weight:600;list-style:none}
details.ac summary::after{content:"›";float:right;color:var(--muted);transition:.2s}
details.ac[open] summary::after{transform:rotate(90deg)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.mbars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:6px}
.mbars .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;cursor:default}
.mbars .pair{display:flex;gap:2px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.mbars .pair i{width:42%;max-width:14px;border-radius:4px 4px 0 0;min-height:2px}
.mbars small{font-size:10px;color:var(--muted)}
</style>
</head>

<script>
'use strict';
/* =========================================================
   ARMUT · Aile bütçesi (gelir / gider / ödemeler)
   Veri: cihazda + Google Drive (Armut klasörü) — YKS-LGS Takip ile aynı düzen
   Yönetici: Google ile bağlanır, kayıt girer (telefon + PC)
   İzleyici: ?izle=DOSYA_ID&k=API_ANAHTARI bağlantısıyla salt okunur görür
   ========================================================= */
const VER = '2.0.0';
const GCID = '152062296588-5bob25d2nfpagn253upfpnor8gdd0lo0.apps.googleusercontent.com';
const GSCOPE = 'https://www.googleapis.com/auth/drive.file';
const DFOLD = 'Armut', DFILE = 'armut_veri.json';
const GAPI = 'https://www.googleapis.com/drive/v3/files', GUP = 'https://www.googleapis.com/upload/drive/v3/files';
const LS_DB = 'armut_db', LS_CFG = 'armut_cfg', LS_TOK = 'armut_gtok', LS_VIEW = 'armut_viewer';
const AYLAR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const AYK = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const ODEME = ['Kredi Kartı','Banka','Nakit','Avans Hesap'];
const PTIP = {
  sabit:  ['Aylık sabit gider','📅'],
  taksit: ['Kredi kartı taksiti','💳'],
  kredi:  ['Banka kredisi','🏦'],
  kurs:   ['Kurs / okul ücreti','🎓'],
  yillik: ['Yılda bir/iki kez','🗓️']
};

const VARSAYILAN_KAT = [
  ['online-market','Online Market','🛒','gider'],['market','Bakkal / Market','🥖','gider'],
  ['online-yemek','Online Yemek','🛵','gider'],['kafe','Kafe / Restoran','☕','gider'],
  ['fatura','Faturalar & İletişim','💡','gider'],['konut','Konut / Site','🏠','gider'],
  ['kredi','Kredi & Borç','🏦','gider'],['egitim','Eğitim','📚','gider'],
  ['saglik','Bakım / Sağlık','💊','gider'],['ev','Ev / Dekorasyon','🛋️','gider'],
  ['giyim','Giyim','👕','gider'],['ulasim','Ulaşım','🚗','gider'],
  ['harclik','Harçlık','👛','gider'],['sans','Şans Oyunu','🎲','gider'],
  ['alkol','Alkol / Butik','🍷','gider'],['diger','Diğer','📦','gider'],
  ['maas','Maaş','💼','gelir'],['ek-gelir','Ek Gelir','✨','gelir'],
  ['tahsilat','Alacak Tahsilatı','🤝','gelir'],['gelir-diger','Diğer Gelir','➕','gelir']
];
// Açıklama yazarken kategoriyi kendiliğinden seçmek için
const KURAL = [
  ['MIGROS','online-market'],['GETIR','online-market'],['CARREFOUR','online-market'],['HEPSIEXPRESS','online-market'],
  ['A101','market'],['SOK','market'],['BIM','market'],['MARKET','market'],['BAKKAL','market'],
  ['YEMEKSEPETI','online-yemek'],['YEMEK SEPETI','online-yemek'],['TRENDYOL YEMEK','online-yemek'],
  ['PASTA','kafe'],['KAHVE','kafe'],['BURGER','kafe'],['PIZZA','kafe'],['BOREK','kafe'],['KAFE','kafe'],['KOFTE','kafe'],['RESTORAN','kafe'],['KURUYEMIS','kafe'],
  ['ELEKTRIK','fatura'],['SU FATURA','fatura'],['DOGALGAZ','fatura'],['INTERNET','fatura'],['TELEFON','fatura'],['VODAFONE','fatura'],['TURKCELL','fatura'],['SPOTIFY','fatura'],
  ['AIDAT','konut'],['DASK','konut'],['EMLAK','konut'],
  ['KREDI','kredi'],
  ['KIRTASIYE','egitim'],['KITAP','egitim'],['DERSHANE','egitim'],['KURS','egitim'],['DENEME','egitim'],['OKUL','egitim'],
  ['ECZANE','saglik'],['GRATIS','saglik'],['WATSONS','saglik'],['DOKTOR','saglik'],['HASTANE','saglik'],
  ['TEKNOSA','ev'],['MEDIA','ev'],['NALBUR','ev'],['IKEA','ev'],['KOCTAS','ev'],['HEPSIBURADA','ev'],['TRENDYOL','ev'],
  ['LCW','giyim'],['DEFACTO','giyim'],['KOTON','giyim'],['AYAKKABI','giyim'],
  ['BENZIN','ulasim'],['AKARYAKIT','ulasim'],['PETROL','ulasim'],['OTOPARK','ulasim'],['TOPLU TASIMA','ulasim'],['OTOBUS','ulasim'],['TAKSI','ulasim'],
  ['BILYONER','sans'],['IDDAA','sans'],['LOTO','sans'],['PIYANGO','sans'],
  ['BIRA','alkol'],['SARAP','alkol'],['RAKI','alkol'],['MAAS','maas']
];

/* ---------- yardımcılar ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();
const uid = () => now().toString(36) + Math.random().toString(36).slice(2, 7);
const nf = new Intl.NumberFormat('tr-TR', {minimumFractionDigits:0, maximumFractionDigits:2});
const nf2 = new Intl.NumberFormat('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2});
const TL = v => nf.format(Math.round((v||0)*100)/100) + ' ₺';
const TLk = v => Math.abs(v) >= 100000 ? nf.format(Math.round(v/1000)) + ' B₺' : TL(v);
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const today = () => iso(new Date());
const trUp = s => String(s||'').toLocaleUpperCase('tr-TR').replace(/İ/g,'I').replace(/Ş/g,'S').replace(/Ğ/g,'G').replace(/Ü/g,'U').replace(/Ö/g,'O').replace(/Ç/g,'C');
const fmtDate = s => { const [y,m,d] = s.split('-'); return +d + ' ' + AYK[+m-1] + ' ' + y; };
const ayAd = k => AYK[+k.slice(5)-1] + ' ' + k.slice(0,4);
const parseAmt = s => {
  s = String(s ?? '').replace(/[₺\s]|TL/gi, '');
  if (!s) return NaN;
  const c = s.lastIndexOf(','), p = s.lastIndexOf('.');
  if (c > -1 && p > -1) s = c > p ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  else if (c > -1) s = s.replace(',', '.');
  else if ((s.match(/\./g)||[]).length > 1) s = s.replace(/\./g,'');
  return parseFloat(s);
};
function toast(msg, ms=2400){ document.querySelectorAll('.toast').forEach(t=>t.remove()); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }

/* ---------- izleyici bağlantısı (YKS-LGS ile aynı: ?izle=ID&k=ANAHTAR) ---------- */
let VIEWER = null;
(() => {
  const q = new URLSearchParams(location.search), id = q.get('izle'), k = q.get('k');
  if (id && k){ VIEWER = {id, k}; localStorage.setItem(LS_VIEW, JSON.stringify(VIEWER)); }
  else { try { VIEWER = JSON.parse(localStorage.getItem(LS_VIEW) || 'null'); } catch(e){} }
  if (VIEWER){ // ana ekrana eklenince de izleyici olarak açılsın
    const base = location.origin + location.pathname.replace(/index\.html$/, '');
    const man = {name:'Armut · Aile Bütçesi', short_name:'Armut', lang:'tr', display:'standalone', background_color:'#FBF8EF', theme_color:'#7FA62A',
      start_url: base + '?izle=' + encodeURIComponent(VIEWER.id) + '&k=' + encodeURIComponent(VIEWER.k), scope: base,
      icons:[{src:base+'icons/icon-192.png',sizes:'192x192',type:'image/png'},{src:base+'icons/icon-512.png',sizes:'512x512',type:'image/png'},{src:base+'icons/icon-maskable-512.png',sizes:'512x512',type:'image/png',purpose:'maskable'}]};
    const l = document.querySelector('link[rel=manifest]'); if (l) l.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man));
  }
})();
const isAdmin = () => !VIEWER;

/* ---------- veri ---------- */
function bosDB(){
  const t = now();
  return { v:2,
    ayar:{donemGun:1, butce:0, kisiler:['Ortak','İlknur','Cem','Umut Cem','Arya'], u:t},
    kategoriler: VARSAYILAN_KAT.map(([id,ad,ikon,tur]) => ({id,ad,ikon,tur,u:t})),
    planlar: [], islemler: [], durum: [] };
}
function uyumla(d){ // eski sürüm verisini tamamla
  if (!d) return d;
  const b = bosDB();
  d.ayar = d.ayar || b.ayar; d.kategoriler = d.kategoriler || b.kategoriler;
  d.planlar = d.planlar || []; d.islemler = d.islemler || []; d.durum = d.durum || [];
  return d;
}
let db = uyumla((() => { try { return JSON.parse(localStorage.getItem(LS_DB)); } catch(e){ return null; } })()) || bosDB();
let cfg = (() => { try { return JSON.parse(localStorage.getItem(LS_CFG)) || {}; } catch(e){ return {}; } })();
const saveLocal = () => localStorage.setItem(LS_DB, JSON.stringify(db));
const saveCfg = () => localStorage.setItem(LS_CFG, JSON.stringify(cfg));
const live = arr => (arr||[]).filter(x => !x.del);
const kat = id => db.kategoriler.find(k => k.id === id) || {id, ad: id || 'Diğer', ikon:'📦', tur:'gider'};

function degisti(){ saveLocal(); render(); if (isAdmin()){ cfg.bekleyen = true; saveCfg(); planlaGonder(); } }
function upsert(list, obj){ obj.u = now(); const i = db[list].findIndex(x => x.id === obj.id); if (i > -1) db[list][i] = obj; else db[list].push(obj); }
function sil(list, id){ const x = db[list].find(x => x.id === id); if (x){ x.del = true; x.u = now(); } }

function birlestir(a, b){
  if (!a) return uyumla(b); if (!b) return a;
  a = uyumla(a); b = uyumla(b);
  const out = {v:2, ayar: (b.ayar?.u||0) > (a.ayar?.u||0) ? b.ayar : a.ayar};
  for (const k of ['kategoriler','planlar','islemler','durum']){
    const m = new Map();
    for (const x of a[k]) m.set(x.id, x);
    for (const x of b[k]){ const y = m.get(x.id); if (!y || (x.u||0) > (y.u||0)) m.set(x.id, x); }
    out[k] = [...m.values()];
  }
  return out;
}

/* ---------- dönem ---------- */
let secili = null; // {y, m}  m: 0-11
function donemOf(dateStr){
  const d = new Date(dateStr + 'T12:00:00'), g = db.ayar.donemGun || 1;
  let y = d.getFullYear(), m = d.getMonth();
  if (d.getDate() < g){ m--; if (m < 0){ m = 11; y--; } }
  return {y, m};
}
function donemAralik(p){
  const g = db.ayar.donemGun || 1;
  const s = new Date(p.y, p.m, g), e = new Date(p.y, p.m+1, g); e.setDate(e.getDate()-1);
  return [iso(s), iso(e)];
}
function donemAd(p){
  if ((db.ayar.donemGun||1) === 1) return AYLAR[p.m] + ' ' + p.y;
  const [s,e] = donemAralik(p), f = x => { const [,m,d] = x.split('-'); return +d + ' ' + AYK[+m-1]; };
  return f(s) + ' – ' + f(e) + ' ' + e.slice(0,4);
}
const kaydir = (p, n) => { const d = new Date(p.y, p.m + n, 1); return {y:d.getFullYear(), m:d.getMonth()}; };
const ayKey = p => p.y + '-' + pad(p.m+1);
const keyP = k => ({y:+k.slice(0,4), m:+k.slice(5)-1});
const islemlerArasi = (s, e) => live(db.islemler).filter(x => x.t >= s && x.t <= e);
function ozet(list){ let gelir = 0, gider = 0; for (const x of list){ if (x.tur === 'gelir') gelir += +x.tutar; else gider += +x.tutar; } return {gelir, gider, net: gelir - gider}; }
function katDagilim(list, tur='gider'){ const m = {}; for (const x of list) if (x.tur === tur) m[x.kat] = (m[x.kat]||0) + +x.tutar;
  return Object.entries(m).filter(([,v]) => Math.abs(v) > 0.004).sort((a,b) => b[1]-a[1]); }

/* ---------- ödeme planları ---------- */
function planAktif(pl, key){
  if (pl.del) return false;
  if (pl.bas && key < pl.bas) return false;
  if (pl.bit && key > pl.bit) return false;
  if (pl.tip === 'yillik' && pl.aylar?.length && !pl.aylar.includes(+key.slice(5))) return false;
  return true;
}
const planOdeme = (pl, key) => live(db.islemler).find(x => x.plan === pl.id && x.ay === key);
function planSira(pl, key){ // kaçıncı taksit / toplam
  if (!pl.bas || !pl.bit || pl.tip === 'sabit' || pl.tip === 'yillik') return '';
  const say = (a, b) => (+b.slice(0,4) - +a.slice(0,4)) * 12 + (+b.slice(5) - +a.slice(5)) + 1;
  return say(pl.bas, key) + '/' + say(pl.bas, pl.bit);
}
function planKalan(pl, key){ // bu ay dahil ödenmemiş taksitler
  if (!pl.bit) return null;
  let n = 0, tutar = 0, p = keyP(key < (pl.bas||key) ? pl.bas : key);
  for (let i = 0; i < 360; i++){ const k = ayKey(p); if (k > pl.bit) break;
    if (planAktif(pl, k) && !planOdeme(pl, k)){ n++; tutar += +pl.tutar || 0; } p = kaydir(p, 1); }
  return {n, tutar};
}
function sonTutar(pl){ const o = live(db.islemler).filter(x => x.plan === pl.id).sort((a,b) => a.ay > b.ay ? -1 : 1)[0]; return o ? Math.abs(o.tutar) : (+pl.tutar || 0); }
function buAyPlanlar(key){
  return live(db.planlar).filter(pl => planAktif(pl, key)).map(pl => ({pl, od: planOdeme(pl, key), tahmin: sonTutar(pl)}))
    .sort((a,b) => (!!a.od - !!b.od) || a.pl.ad.localeCompare(b.pl.ad, 'tr'));
}

/* ---------- Google Drive (YKS-LGS ile aynı yöntem) ---------- */
let gTok = (() => { try { return JSON.parse(localStorage.getItem(LS_TOK)); } catch(e){ return null; } })();
const tokOk = () => gTok && gTok.exp > now() + 60000;
let durumSync = 'off', gonderZ = null, mesgul = false, tokenClient = null;
function gisYukle(){
  if (window.google?.accounts?.oauth2) return Promise.resolve();
  return new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onload = ok; s.onerror = () => no(new Error('Google yüklenemedi (internet?)')); document.head.appendChild(s); });
}
function driveBaglan(){ // dokunuşla çağrılır (açılır pencere)
  if (!window.google?.accounts?.oauth2){ gisYukle().then(() => toast('Hazır, tekrar dokun')).catch(e => toast(e.message)); return; }
  tokenClient = tokenClient || google.accounts.oauth2.initTokenClient({client_id: GCID, scope: GSCOPE,
    callback: r => { if (r.error){ toast('Google girişi yapılamadı'); return; }
      gTok = {t: r.access_token, exp: now() + (r.expires_in||3600) * 1000}; localStorage.setItem(LS_TOK, JSON.stringify(gTok));
      cfg.gBagli = true; saveCfg(); esitle(); },
    error_callback: () => toast('Google girişi iptal edildi')});
  tokenClient.requestAccessToken({prompt: cfg.gBagli ? '' : 'consent'});
}
function driveKes(){ if (gTok && window.google?.accounts?.oauth2) google.accounts.oauth2.revoke(gTok.t, () => {});
  gTok = null; localStorage.removeItem(LS_TOK); cfg.gBagli = false; cfg.folderId = cfg.fileId = null; saveCfg(); syncDurum('off'); render(); }
async function gf(url, opt = {}){
  const r = await fetch(url, {...opt, headers: {...(opt.headers||{}), Authorization: 'Bearer ' + gTok.t}});
  if (r.status === 401){ gTok = null; localStorage.removeItem(LS_TOK); const e = new Error('Google oturumunun süresi doldu. Üstteki Drive düğmesine dokun.'); e.auth = 1; throw e; }
  if (!r.ok){ const e = new Error('Drive hatası (' + r.status + ')'); e.status = r.status; throw e; }
  return r;
}
async function klasorId(){
  if (cfg.folderId) return cfg.folderId;
  const q = encodeURIComponent(`name='${DFOLD}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  let id = (await (await gf(`${GAPI}?q=${q}&fields=files(id)&spaces=drive`)).json()).files?.[0]?.id;
  if (!id) id = (await (await gf(`${GAPI}?fields=id`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name: DFOLD, mimeType:'application/vnd.google-apps.folder'})})).json()).id;
  cfg.folderId = id; saveCfg(); return id;
}
async function dosyaBul(){
  if (cfg.fileId) return cfg.fileId;
  const fid = await klasorId(), q = encodeURIComponent(`name='${DFILE}' and '${fid}' in parents and trashed=false`);
  cfg.fileId = (await (await gf(`${GAPI}?q=${q}&fields=files(id)&spaces=drive`)).json()).files?.[0]?.id || null; saveCfg(); return cfg.fileId;
}
async function dosyaOlustur(ad, icerik){
  const fid = await klasorId(), b = 'armut' + uid();
  const body = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name: ad, parents: [fid], mimeType:'application/json'})}\r\n--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${icerik}\r\n--${b}--`;
  return (await (await gf(`${GUP}?uploadType=multipart&fields=id`, {method:'POST', headers:{'Content-Type':'multipart/related; boundary=' + b}, body})).json()).id;
}
async function driveOku(){
  const id = await dosyaBul(); if (!id) return null;
  try { return await (await gf(`${GAPI}/${id}?alt=media`, {cache:'no-store'})).json(); }
  catch(e){ if (e.status === 404){ cfg.fileId = null; saveCfg(); return null; } throw e; }
}
async function driveYaz(){
  const icerik = JSON.stringify(db), id = await dosyaBul();
  if (id){ try { await gf(`${GUP}/${id}?uploadType=media`, {method:'PATCH', headers:{'Content-Type':'application/json; charset=UTF-8'}, body: icerik}); }
    catch(e){ if (e.status !== 404) throw e; cfg.fileId = await dosyaOlustur(DFILE, icerik); saveCfg(); } }
  else { cfg.fileId = await dosyaOlustur(DFILE, icerik); saveCfg(); }
  if (cfg.sonYedek !== today()){ await dosyaOlustur(`yedek_${today()}.json`, icerik); cfg.sonYedek = today(); saveCfg(); } // günlük yedek
}
function syncDurum(s){ durumSync = s; const el = $('#syncLbl'), d = $('#syncDot'); if (!el) return;
  const t = {off:'Drive’a bağlan', ok:'Drive · güncel', wait:'Eşitleniyor…', err:'Eşitleme hatası', ro:'Güncel', need:'Kaydetmek için dokun'};
  el.textContent = t[s] || s; d.className = 'dot ' + ({ok:'ok', ro:'ok', wait:'wait', err:'err', need:'wait'}[s] || ''); }
function syncTikla(){
  if (VIEWER) return esitle();
  if (!tokOk()) return driveBaglan();
  esitle();
}
async function esitle(sessiz){
  if (mesgul) return;
  if (VIEWER){ // izleyici: yöneticinin son verisini oku
    mesgul = true; syncDurum('wait');
    try { const r = await fetch(`${GAPI}/${encodeURIComponent(VIEWER.id)}?alt=media&key=${encodeURIComponent(VIEWER.k)}&t=${now()}`, {cache:'no-store'});
      if (!r.ok) throw new Error(r.status === 404 ? 'Paylaşılan dosya bulunamadı. Yeni bağlantı iste.' : 'Veri alınamadı (' + r.status + ')');
      db = uyumla(await r.json()); saveLocal(); cfg.sonSync = now(); saveCfg(); syncDurum('ro'); render();
    } catch(e){ syncDurum('err'); if (!sessiz) toast(e.message, 4000); }
    finally { mesgul = false; } return;
  }
  if (!tokOk()){ syncDurum(cfg.gBagli ? 'need' : 'off'); return; }
  mesgul = true; syncDurum('wait');
  try {
    const uzak = await driveOku();
    if (uzak) db = birlestir(db, uzak);
    saveLocal(); await driveYaz();
    cfg.bekleyen = false; cfg.sonSync = now(); saveCfg(); syncDurum('ok'); render();
  } catch(e){ syncDurum(e.auth ? 'need' : 'err'); if (!sessiz) toast(e.message, 4000); console.warn(e); }
  finally { mesgul = false; }
}
function planlaGonder(){ if (!tokOk()){ syncDurum(cfg.gBagli ? 'need' : 'off'); return; } syncDurum('wait'); clearTimeout(gonderZ); gonderZ = setTimeout(() => esitle(true), 1500); }

/* ---------- ANA SAYFA ---------- */

  const son = [...list].sort((a,b) => b.t === a.t ? b.u - a.u : (b.t > a.t ? 1 : -1)).slice(0,5);
  const pl = buAyPlanlar(ayKey(secili)), od = pl.filter(x => x.od).length, bekl = pl.filter(x => !x.od).reduce((a,x) => a + x.tahmin, 0);

    <div class="trio">
      <div class="pill in"><small>Gelir</small><b>${TL(o.gelir)}</b></div>
      <div class="pill ${o.net<0?'out':'in'}"><small>${o.net<0?'Açık':'Kalan'}</small><b>${TL(Math.abs(o.net))}</b></div>
    </div>
    ${butce ? `<div class="budget"><div class="track"><i class="${oran>1?'over':''}" style="width:${Math.min(100,oran*100).toFixed(1)}%"></i></div>
      <div class="row"><span>Bütçe ${TL(butce)}</span><span>${oran>1 ? TL(o.gider-butce)+' aşıldı' : TL(butce-o.gider)+' kaldı'}</span></div></div>` : ''}
  </div>
  ${pl.length ? `<div class="card" style="cursor:pointer" onclick="sekme='odeme';odMod='ay';render()">
    <div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">💳 Bu ayın ödemeleri</h3><span class="small"><b>${od}/${pl.length}</b> ödendi ›</span></div>
    <div class="track" style="margin:10px 0 6px"><i style="width:${pl.length ? od/pl.length*100 : 0}%"></i></div>
    <div class="small muted">${bekl > 0 ? 'Bekleyen yaklaşık <b style="color:var(--ink)">' + TL(bekl) + '</b>' : 'Bu ayın tüm ödemeleri yapıldı 🎉'}</div></div>` : ''}
  <div class="card cats"><h3>En çok harcanan</h3>
    ${top.length ? top.map(([k,v]) => { const c = kat(k); return `<div class="c"><div class="ic">${c.ikon}</div>
      <div><div class="nm">${esc(c.ad)}<span>%${Math.round(v/o.gider*100)}</span></div><div class="bar"><i style="width:${Math.max(2,v/max*100)}%"></i></div></div>
      <div class="v">${TL(v)}</div></div>`; }).join('') : '<div class="empty">Bu ay henüz harcama yok.</div>'}
  </div>
  <div class="card"><h3>Son kayıtlar</h3>

      : '<div class="empty">Kayıt yok.' + (isAdmin() ? ' Sağ alttaki + ile ekleyebilirsin.' : '') + '</div>'}

function txSatir(x){
  const c = kat(x.kat), out = x.tur !== 'gelir';
  const alt = [fmtDate(x.t), x.kisi && x.kisi !== 'Ortak' ? x.kisi : '', x.odeme].filter(Boolean).join(' · ');

    <div class="amt ${out?'out':'in'}">${out ? '−' : '+'}${TL(Math.abs(x.tutar))}</div></div>`;
}

/* ---------- KAYITLAR ---------- */

  const list = islemlerArasi(s,e).filter(x => (!filtre.kat || x.kat === filtre.kat) && (!filtre.tur || x.tur === filtre.tur) && (!q || trUp(x.acik + ' ' + kat(x.kat).ad + ' ' + (x.kisi||'')).includes(q)))
    .sort((a,b) => b.t === a.t ? b.u - a.u : (b.t > a.t ? 1 : -1));

/* ---------- ÖDEMELER ---------- */
function odemeSayfa(){
  const seg = `<div class="seg">${[['ay','Bu ay'],['plan','Planlar'],['durum','Borç · Varlık']].map(([k,t]) => `<button class="${odMod===k?'on':''}" onclick="odMod='${k}';render()">${t}</button>`).join('')}</div>`;

    <div class="track" style="margin-top:12px"><i style="width:${L.filter(x=>x.od).length/L.length*100}%"></i></div>

  <div class="card">
    ${L.map(({pl, od, tahmin}) => { const sira = planSira(pl, key), kal = planKalan(pl, key);

  fTur = x?.tur || 'gider'; fKat = x?.kat || ''; fKisi = x?.kisi || 'Ortak'; fOdeme = x?.odeme || 'Kredi Kartı';
  const ciz = () => {
    const kats = live(db.kategoriler).filter(k => k.tur === fTur);
    if (!kats.some(k=>k.id===fKat)) fKat = '';
    $('#fBody').innerHTML = `
      <div class="seg gg"><button class="out ${fTur==='gider'?'on':''}" data-t="gider">Gider</button><button class="in ${fTur==='gelir'?'on':''}" data-t="gelir">Gelir</button></div>
      <input class="i amtin" id="fTut" inputmode="decimal" placeholder="0 ₺" value="${x ? nf2.format(Math.abs(x.tutar)) : ($('#fTut')?.value||'')}">
      ${x?.plan ? '<div class="small muted" style="text-align:center">Bu kayıt bir ödeme planından geliyor.</div>' : ''}
      <label class="f">Kategori</label><div class="chips" id="fKats">${kats.map(k=>`<button class="chip ${fKat===k.id?'on':''}" data-k="${k.id}">${k.ikon} ${esc(k.ad)}</button>`).join('')}</div>
      <label class="f">Açıklama</label><input class="i" id="fAc" list="acList" placeholder="ör. Migros, Arya ayakkabı" value="${esc(x?.acik || $('#fAc')?.value || '')}">
      <div class="row2"><div><label class="f">Tarih</label><input class="i" type="date" id="fTar" value="${x?.t || $('#fTar')?.value || today()}"></div>
      ${fTur==='gider' && !x ? `<div><label class="f">Taksit</label><select class="i" id="fTak">${[1,2,3,4,5,6,8,9,10,12,18,24].map(n=>`<option value="${n}">${n===1?'Peşin':n+' taksit'}</option>`).join('')}</select></div>` : '<div></div>'}</div>
      <div id="fTakNot" class="small muted" style="display:none;margin-top:6px">Taksitli alışveriş <b>Ödemeler</b>'e plan olarak eklenir; ilk taksit bu ay ödendi sayılır, kalanları her ay işaretlersin.</div>
      <label class="f">Kimin için</label><div class="chips" id="fKisi">${db.ayar.kisiler.map(k=>`<button class="chip ${fKisi===k?'on':''}" data-v="${esc(k)}">${esc(k)}</button>`).join('')}</div>
      ${fTur==='gider' ? `<label class="f">Ödeme</label><div class="chips" id="fOd">${ODEME.map(k=>`<button class="chip ${fOdeme===k?'on':''}" data-v="${k}">${k}</button>`).join('')}</div>` : ''}
      <label class="f">Not</label><input class="i" id="fNot" value="${esc(x?.not||'')}">
      <div class="btns">${x?`<button class="btn red" id="fSil">Sil</button>`:''}<button class="btn" id="fKay">${x?'Güncelle':'Kaydet'}</button></div>`;
    document.querySelectorAll('#fBody .seg button').forEach(b => b.onclick = () => { fTur = b.dataset.t; ciz(); });
    const tek = (sel, set) => document.querySelectorAll(sel + ' .chip').forEach(b => b.onclick = () => { set(b.dataset.k || b.dataset.v); document.querySelectorAll(sel + ' .chip').forEach(c => c.classList.toggle('on', c === b)); });
    tek('#fKats', v => fKat = v); tek('#fKisi', v => fKisi = v); tek('#fOd', v => fOdeme = v);
    $('#fAc').oninput = e => { const k = kuralBul(e.target.value); if (k && kat(k).tur === fTur){ fKat = k; document.querySelectorAll('#fKats .chip').forEach(c => c.classList.toggle('on', c.dataset.k === k)); } };
    if ($('#fTak')) $('#fTak').onchange = e => $('#fTakNot').style.display = +e.target.value > 1 ? '' : 'none';
    if (x) $('#fSil').onclick = () => { if (confirm('Bu kayıt silinsin mi?')){ sil('islemler', x.id); kapat(); degisti(); toast('Silindi'); } };
    $('#fKay').onclick = () => {
      const t = parseAmt($('#fTut').value);
      if (!(t > 0)) return toast('Tutarı gir'); if (!fKat) return toast('Kategori seç');
      const base = {tur:fTur, kat:fKat, acik:$('#fAc').value.trim(), kisi:fKisi, odeme: fTur==='gider'?fOdeme:'', not:$('#fNot').value.trim()};
      const tarih = $('#fTar').value || today();
      if (x){ upsert('islemler', {...x, ...base, tutar:t, t:tarih}); kapat(); degisti(); return toast('Güncellendi'); }
      const n = +($('#fTak')?.value || 1);
      if (n > 1){ // taksit planı
        const bas = ayKey(donemOf(tarih)), pay = Math.round(t / n * 100) / 100;
        const pl = {id:uid(), tip:'taksit', ad: base.acik || kat(fKat).ad, kat:fKat, tutar:pay, bas, bit: ayKey(kaydir(keyP(bas), n-1)), aylar:[], odeme:fOdeme, kisi:fKisi, not:'Toplam ' + TL(t) + ', ' + n + ' taksit'};
        upsert('planlar', pl); planOde(pl, bas, pay, tarih, fOdeme);
        kapat(); degisti(); return toast(n + ' taksitlik plan oluşturuldu 🍐');
      }
      upsert('islemler', {...base, id:uid(), t:tarih, tutar:t}); kapat(); degisti(); toast('Kaydedildi 🍐');
    };
  };
  sheet(`<h2>${x?'Kaydı düzenle':'Yeni kayıt'}</h2><div id="fBody"></div>
    <datalist id="acList">${[...new Set(live(db.islemler).slice(-400).filter(i=>!i.plan).map(i=>i.acik).filter(Boolean))].slice(-80).map(a=>`<option value="${esc(a)}">`).join('')}</datalist>`);
  ciz(); if (!x) setTimeout(() => $('#fTut')?.focus(), 250);
}

/* ---------- AYARLAR ---------- */
function ayarSayfa(){
  const a = db.ayar, ad = isAdmin(), dis = ad ? '' : 'disabled';
  return `
  <div class="card"><h3>${ad ? 'Google Drive' : 'Paylaşım'}</h3>
    ${ad ? `<div class="kv"><span>Durum</span><b class="small">${tokOk() ? '✅ Bağlı — Drive / Armut klasörü' : cfg.gBagli ? '⏸ Oturum yenilenmeli' : 'Bağlı değil'}</b></div>`
         : `<div class="kv"><span>Rol</span><span class="badge">İzleyici</span></div><p class="small muted" style="margin:4px 0 0">Yöneticinin girdiği verileri görürsün. Uygulamayı açınca ya da üstteki “Güncel”e dokununca yenilenir.</p>`}
    ${cfg.sonSync ? `<div class="kv"><span>Son eşitleme</span><span class="small">${new Date(cfg.sonSync).toLocaleString('tr-TR')}</span></div>` : ''}
    <div class="btns">${ad ? (tokOk() ? '<button class="btn" onclick="esitle()">Şimdi eşitle</button>' : '<button class="btn" onclick="driveBaglan()">Drive’a bağlan</button>') : '<button class="btn" onclick="esitle()">Yenile</button>'}</div>
    ${ad && tokOk() ? '<div class="btns"><button class="btn ghost" onclick="paylasFormu()">📲 Eşime bağlantı gönder</button></div>' : ''}
    ${ad && cfg.gBagli ? '<p class="small muted" style="text-align:center;margin:10px 0 0"><a href="#" onclick="event.preventDefault();if(confirm(\'Drive bağlantısı bu cihazda kesilsin mi? Drive’daki veri silinmez.\'))driveKes()">Bağlantıyı kes</a></p>' : ''}
  </div>
  ${ad ? `
  <div class="card"><h3>Genel</h3>
    <label class="f">Aylık bütçe hedefi (₺, boş = kapalı)</label><input class="i" ${dis} inputmode="decimal" value="${a.butce?nf2.format(a.butce):''}" onchange="db.ayar.butce=parseAmt(this.value)||0;db.ayar.u=now();degisti()">
    <label class="f">Ay başlangıç günü</label>
    <select class="i" ${dis} onchange="db.ayar.donemGun=+this.value;db.ayar.u=now();secili=null;degisti()">${Array.from({length:28},(_,i)=>`<option ${a.donemGun===i+1?'selected':''} value="${i+1}">${i===0?'Ayın 1’i (takvim ayı)':'Her ayın '+(i+1)+'’i (ör. kart kesim günü)'}</option>`).join('')}</select>
    <label class="f">Aile üyeleri (virgülle)</label><input class="i" ${dis} value="${esc(a.kisiler.join(', '))}" onchange="db.ayar.kisiler=this.value.split(',').map(s=>s.trim()).filter(Boolean);if(!db.ayar.kisiler.length)db.ayar.kisiler=['Ortak'];db.ayar.u=now();degisti()">
  </div>
  <div class="card"><details class="ac" style="border:0;padding:0"><summary>🏷️ Kategoriler (${live(db.kategoriler).length})</summary>
    ${live(db.kategoriler).map(k => `<div class="li"><input class="i" style="width:52px;text-align:center" value="${k.ikon}" onchange="katGuncelle('${k.id}','ikon',this.value)">
      <input class="i grow" value="${esc(k.ad)}" onchange="katGuncelle('${k.id}','ad',this.value)"><span class="small muted">${k.tur}</span>
      <button class="x" onclick="if(confirm('Kategori silinsin mi? Eski kayıtlar korunur.')){sil('kategoriler','${k.id}');degisti()}">✕</button></div>`).join('')}
    <div class="btns"><button class="btn ghost sm" onclick="yeniKat('gider')">+ Gider kategorisi</button><button class="btn ghost sm" onclick="yeniKat('gelir')">+ Gelir kategorisi</button></div></details></div>
  <div class="card"><h3>Veri</h3>
    <button class="btn ghost" onclick="dosyaSec()">📂 İlk veri / yedek dosyası yükle (.json)</button><div style="height:8px"></div>
    <button class="btn ghost" onclick="yedekIndir()">💾 Yedek indir (.json)</button>
    <p class="small muted" style="margin:8px 0 0">Drive'a bağlıyken her gün Armut klasörüne otomatik yedek de alınır.</p></div>` : ''}
  <p class="small muted" style="text-align:center">Armut v${VER}</p>`;
}
function katGuncelle(id, alan, v){ const k = db.kategoriler.find(z => z.id === id); k[alan] = v; k.u = now(); degisti(); }
function yeniKat(tur){ const ad = prompt('Kategori adı:'); if (!ad) return; const ikon = prompt('Simge (emoji):', tur==='gider'?'🏷️':'💵') || '🏷️';
  upsert('kategoriler', {id: 'k' + uid(), ad, ikon, tur}); degisti(); }

/* ---------- yedek / ilk veri ---------- */
function indir(ad, blob){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = ad; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000); }
function yedekIndir(){ indir('armut-yedek-' + today() + '.json', new Blob([JSON.stringify(db)], {type:'application/json'})); }
function dosyaSec(){ const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
  i.onchange = async () => { try { const j = JSON.parse(await i.files[0].text());
      if (j.armutIlkVeri) return ilkVeriYukle(j);
      if (!j.islemler) throw 0;
      if (!confirm('Yedekteki ' + live(j.islemler).length + ' kayıt mevcut verilerle birleştirilsin mi?')) return;
      db = birlestir(db, j); degisti(); toast('Yedek yüklendi');
    } catch(e){ toast('Dosya okunamadı'); } };
  i.click(); }
function ilkVeriYukle(j){
  if (live(db.islemler).some(x => x.kaynak === 'excel') && !confirm('Excel verisi daha önce yüklenmiş. Yine de eklensin mi? (çift kayıt olur)')) return;
  if (!confirm(`Excel'inden: ${j.planlar.length} ödeme planı, ${j.islemler.length} aylık kayıt ve ${j.durum.length} varlık/alacak eklensin mi?`)) return;
  const idMap = {};
  for (const p of j.planlar){ const yeni = uid(); idMap[p.id] = yeni; upsert('planlar', {...p, id: yeni}); }
  for (const x of j.islemler) upsert('islemler', {...x, id: uid(), kaynak:'excel', ...(x.plan ? {plan: idMap[x.plan]} : {})});
  for (const d of j.durum) upsert('durum', {...d, id: uid()});
  degisti(); toast('Excel verisi yüklendi 🍐');
}

/* ---------- Excel raporu ---------- */
function xlsxYukle(){ return window.XLSX ? Promise.resolve() : new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js'; s.onload = ok; s.onerror = () => no(new Error('Excel kütüphanesi yüklenemedi (internet?)')); document.head.appendChild(s); }); }
async function excelIndir(){
  try { await xlsxYukle(); } catch(e){ return toast(e.message); }
  const y = secili.y, yil = raporMod === 'yil';
  const [s,e] = yil ? [donemAralik({y,m:0})[0], donemAralik({y,m:11})[1]] : donemAralik(secili);
  const list = islemlerArasi(s,e).sort((a,b) => a.t > b.t ? 1 : -1), wb = XLSX.utils.book_new(), sayi = '#,##0.00';
  const k1 = [['Tarih','Tür','Kategori','Açıklama','Tutar (₺)','Kimin için','Ödeme','Not']].concat(list.map(x => [new Date(x.t+'T12:00'), x.tur==='gelir'?'Gelir':'Gider', kat(x.kat).ad, x.acik||'', +x.tutar, x.kisi||'', x.odeme||'', x.not||'']));
  const w1 = XLSX.utils.aoa_to_sheet(k1, {cellDates:true}); w1['!cols'] = [{wch:11},{wch:7},{wch:22},{wch:36},{wch:12},{wch:12},{wch:12},{wch:20}];
  w1['!autofilter'] = {ref:'A1:H' + k1.length}; for (let r=2;r<=k1.length;r++){ if (w1['E'+r]) w1['E'+r].z = sayi; if (w1['A'+r]) w1['A'+r].z = 'dd.mm.yyyy'; }
  XLSX.utils.book_append_sheet(wb, w1, 'Kayıtlar');
  const aylar = yilVerisi(y), pv = [['Kategori', ...AYLAR, 'TOPLAM']];
  for (const [k] of katDagilim(aylar.flatMap(a=>a.l))) pv.push([kat(k).ad, ...aylar.map(a => +a.l.filter(x=>x.tur==='gider'&&x.kat===k).reduce((s,x)=>s + +x.tutar,0).toFixed(2))]);
  pv.push(['GİDER TOPLAM', ...aylar.map(a => +a.o.gider.toFixed(2))], ['GELİR TOPLAM', ...aylar.map(a => +a.o.gelir.toFixed(2))], ['NET', ...aylar.map(a => +a.o.net.toFixed(2))]);
  const w2 = XLSX.utils.aoa_to_sheet(pv); for (let r=2;r<=pv.length;r++) w2['N'+r] = {t:'n', f:`SUM(B${r}:M${r})`, z:sayi};
  w2['!cols'] = [{wch:24}, ...Array(13).fill({wch:11})]; XLSX.utils.book_append_sheet(wb, w2, y + ' Kategori-Ay');
  const P = live(db.planlar), pp = [['Ödeme', 'Tür', ...AYLAR, 'TOPLAM']];
  for (const p of P){ const satir = [p.ad, PTIP[p.tip][0]];
    for (let m=0;m<12;m++){ const o = planOdeme(p, ayKey({y,m})); satir.push(o ? +Math.abs(o.tutar).toFixed(2) : ''); } pp.push(satir); }
  const w3 = XLSX.utils.aoa_to_sheet(pp); for (let r=2;r<=pp.length;r++) w3['O'+r] = {t:'n', f:`SUM(C${r}:N${r})`, z:sayi};
  w3['!cols'] = [{wch:26},{wch:18}, ...Array(13).fill({wch:10})]; XLSX.utils.book_append_sheet(wb, w3, y + ' Ödemeler');
  const key = ayKey(donemOf(today())), pl = [['Ödeme','Tür','Kategori','Aylık tutar','Başlangıç','Bitiş','Kalan taksit','Kalan tutar','Not']];
  for (const p of P){ const k = planKalan(p, key); pl.push([p.ad, PTIP[p.tip][0], kat(p.kat).ad, +p.tutar||'', p.bas||'', p.bit||'süresiz', k ? k.n : '', k ? +k.tutar.toFixed(2) : '', p.not||'']); }
  const w4 = XLSX.utils.aoa_to_sheet(pl); w4['!cols'] = [{wch:26},{wch:18},{wch:20},{wch:12},{wch:10},{wch:10},{wch:12},{wch:12},{wch:30}];
  XLSX.utils.book_append_sheet(wb, w4, 'Ödeme Planları');
  const dv = [['Tür','Ad','Tutar (₺)','Not']];
  for (const t of ['varlik','alacak','borc']) for (const x of live(db.durum).filter(z=>z.tip===t)) dv.push([DTIP[t][0], x.ad, +x.tutar, x.not||'']);
  const w5 = XLSX.utils.aoa_to_sheet(dv); w5['!cols'] = [{wch:14},{wch:28},{wch:14},{wch:30}]; XLSX.utils.book_append_sheet(wb, w5, 'Borç-Varlık');
  XLSX.writeFile(wb, `Armut_${yil ? y : AYLAR[secili.m] + '_' + secili.y}.xlsx`);
}

/* ---------- alt pencere ---------- */
function sheet(html){ kapat(); const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.id = 'sheet';
  bg.innerHTML = `<div class="sheet"><div class="grab"></div>${html}</div>`; bg.onclick = e => { if (e.target === bg) kapat(); }; document.body.appendChild(bg); }
function kapat(){ $('#sheet')?.remove(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') kapat(); });

/* ---------- başlat ---------- */
render();
if (VIEWER) esitle(true);
else { gisYukle().catch(() => {}); if (tokOk()) esitle(true); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !$('#sheet') && (VIEWER || tokOk())) esitle(true); });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
